<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#891820"><meta name="description" content="Thiệp cưới Bính Tuấn và Hoàng Thảo"><title>Thiệp cưới Bính Tuấn & Hoàng Thảo</title>
<style>
:root{--p:0;--pull:0;--show:0;--flip1:0;--flip2:0;--finish:0;--paper:#fffaf2;--wine:#85151b}*{box-sizing:border-box}html{scrollbar-width:thin;scrollbar-color:#9b7368 transparent}body{margin:0;color:#6e3b37;background:#eaded1;font-family:Georgia,'Times New Roman',serif}button,a{font:inherit}button{cursor:pointer}.journey{height:580svh}.stage{height:100svh;position:sticky;top:0;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 35%,#fffaf3 0,#f1e6da 65%,#dec7b6 100%)}.stage:before{content:"";position:absolute;inset:12px;border:1px solid #b7957755;pointer-events:none}.head{position:absolute;top:max(17px,env(safe-area-inset-top));left:0;right:0;text-align:center;font:600 10px system-ui,sans-serif;letter-spacing:.22em;color:#936c5e;opacity:clamp(0,calc(1 - var(--show)*3),1)}
.envelope-wrap{position:absolute;width:min(84vw,calc(82svh * 740 / 1312),485px);aspect-ratio:740/1312;transform:translateY(calc(var(--pull)*14vh)) scale(calc(1 - var(--pull)*.12));opacity:calc(1 - var(--show));filter:drop-shadow(0 15px 22px #53231e36);pointer-events:none}.pull-window{position:absolute;z-index:1;top:-62%;height:82%;left:13%;width:74%;overflow:hidden}.pull-sheet{position:absolute;left:0;bottom:calc(-87% + var(--pull)*89%);width:100%;height:87%;background:#fffaf3;box-shadow:0 0 8px #3b151542;will-change:bottom}.pull-sheet img{width:100%;height:100%;display:block}.envelope-face{position:absolute;inset:0;z-index:2}.envelope-face img{width:100%;height:100%;display:block}.guest-name{position:absolute;left:15%;top:76.25%;width:70%;height:4.4%;display:grid;place-items:center;text-align:center;color:#fceccc;font-family:'Brush Script MT','Segoe Script',Georgia,serif;font-size:clamp(11px,2.2vw,19px);line-height:1.05;text-shadow:0 1px 2px #440707;overflow-wrap:anywhere}.guest-name:empty{display:none}
.book{position:absolute;width:min(82vw,calc(79svh * 652 / 910),505px);aspect-ratio:652/910;perspective:1600px;transform:translateY(calc((1 - var(--show))*-2vh)) scale(calc(.88 + var(--show)*.12));opacity:var(--show);pointer-events:none;filter:drop-shadow(0 14px 28px #4d2d2d40)}.book-frame{position:absolute;inset:0;transform-style:preserve-3d}.base{position:absolute;inset:0;background:var(--wine);box-shadow:0 0 0 1px #ac8874,0 3px 16px #2d121333}.base img{display:block;width:100%;height:100%;object-fit:fill}.leaf{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform}.leaf.vi{z-index:3;transform:rotateY(calc(var(--flip1)*-179.8deg))}.leaf.zh{z-index:2;transform:rotateY(calc(var(--flip2)*-179.8deg))}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fffaf4;box-shadow:1px 0 7px #32131324}.face img{display:block;width:100%;height:100%;object-fit:fill}.face.reverse{transform:rotateY(180deg);background:#f2e5da;display:grid;place-items:center;border:1px solid #c4a996}.face.reverse:after{content:'囍';font-size:clamp(45px,12vw,76px);color:#a02d35;opacity:.48}.spine{position:absolute;z-index:6;top:0;bottom:0;left:0;width:4px;opacity:.7;background:linear-gradient(90deg,#775a51,#f8f0e8)}
.final-buttons{position:absolute;left:5%;right:5%;bottom:5%;z-index:10;display:flex;justify-content:center;gap:8px;opacity:var(--finish);transform:translateY(calc((1 - var(--finish))*12px));pointer-events:none}.complete .final-buttons{pointer-events:auto}.pill{min-height:39px;padding:10px 14px;border-radius:24px;border:1px solid #f0d6b0;color:#72161b;background:#fff7e9;font:600 12px system-ui,sans-serif;text-decoration:none;white-space:nowrap;box-shadow:0 3px 11px #2d111133}.pill.secondary{background:#81171c;color:#fff7eb}.pill:focus-visible{outline:3px solid #dcb877;outline-offset:3px}.hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:8px;right:8px;text-align:center;font:600 10px system-ui,sans-serif;letter-spacing:.1em;color:#956352;z-index:12;opacity:calc(1 - var(--finish))}.hint strong{display:block;font-size:21px;margin-bottom:4px;font-weight:400;animation:bob 1.9s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.progress{position:absolute;z-index:12;right:12px;top:34%;height:27%;width:2px;background:#aa86744a}.progress i{display:block;width:100%;height:calc(var(--p)*100%);background:#87222c}.page-no{position:absolute;right:19px;top:20px;font:11px system-ui,sans-serif;letter-spacing:.08em;color:#9e8174}.soundless{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:600px){.stage:before{inset:7px}.envelope-wrap{width:min(94vw,calc(77svh * 740 / 1312))}.book{width:min(94vw,calc(76svh * 652 / 910))}.guest-name{font-size:clamp(11px,3vw,16px)}.final-buttons{bottom:4%;gap:5px}.pill{font-size:11px;padding:8px 11px}.hint{font-size:9px}.page-no{right:13px}}@media(max-height:620px){.head{display:none}.hint{bottom:4px}.book{width:min(78vw,calc(76svh * 652 / 910))}.envelope-wrap{width:min(74vw,calc(85svh * 740 / 1312))}}@media(prefers-reduced-motion:reduce){.hint strong{animation:none}}
</style></head><body>
<main class="journey" id="journey"><section class="stage" id="stage" aria-label="Thiệp cưới tương tác; cuộn hoặc vuốt lên để mở và lật trang">
<div class="head">囍 &nbsp; BÍNH TUẤN &amp; HOÀNG THẢO &nbsp; 囍</div>
<div class="envelope-wrap" aria-label="Vỏ thiệp đỏ"><div class="pull-window" aria-hidden="true"><div class="pull-sheet"><img src="assets/insert_vi.png" alt=""></div></div><div class="envelope-face"><img src="assets/sleeve.png" alt="Vỏ thiệp cưới truyền thống"><div class="guest-name" id="guestName"></div></div></div>
<div class="book" id="book" aria-label="Thiệp gồm ba trang: Việt, Hoa, lời cảm ơn"><div class="book-frame"><div class="base"><img src="assets/thanks.png" alt="Lời cảm ơn"></div><div class="leaf zh"><div class="face"><img src="assets/insert_zh.png" alt="Trang thiệp tiếng Hoa"></div><div class="face reverse"></div></div><div class="leaf vi"><div class="face"><img src="assets/insert_vi.png" alt="Trang thiệp tiếng Việt"></div><div class="face reverse"></div></div><div class="spine" aria-hidden="true"></div></div><div class="final-buttons"><a class="pill" href="https://www.google.com/maps/search/?api=1&amp;query=Queen%20Plaza%20K%E1%BB%B3%20Ho%C3%A0%2016A%20L%C3%AA%20H%E1%BB%93ng%20Phong%20TPHCM" target="_blank" rel="noopener noreferrer">Xem bản đồ ↗</a><button class="pill secondary" id="replay" type="button">Xem lại ↺</button></div></div>
<div class="page-no" id="pageNo">MỞ THIỆP</div><div class="progress" aria-hidden="true"><i></i></div><div class="hint"><strong>↑</strong><span id="hintText">CUỘN XUỐNG · VUỐT LÊN ĐỂ RÚT THIỆP</span></div>
</section></main>
<script>
(()=>{'use strict';const journey=document.getElementById('journey'),stage=document.getElementById('stage'),guest=document.getElementById('guestName'),pageNo=document.getElementById('pageNo'),hint=document.getElementById('hintText');const clamp=x=>Math.max(0,Math.min(1,x)),section=(x,a,b)=>clamp((x-a)/(b-a));const name=(new URLSearchParams(location.search).get('guest')||'').trim().slice(0,90);guest.textContent=name;let raf=0;
function render(){raf=0;const total=Math.max(1,journey.offsetHeight-innerHeight);const p=clamp(-journey.getBoundingClientRect().top/total);const pull=section(p,.045,.24),show=section(p,.24,.32),f1=section(p,.43,.56),f2=section(p,.68,.81),finish=section(p,.86,.92);for(const [key,val] of Object.entries({'--p':p,'--pull':pull,'--show':show,'--flip1':f1,'--flip2':f2,'--finish':finish}))stage.style.setProperty(key,val.toFixed(4));stage.classList.toggle('complete',p>=.92);if(p<.33){pageNo.textContent='MỞ THIỆP';hint.textContent='CUỘN XUỐNG · VUỐT LÊN ĐỂ RÚT THIỆP'}else if(p<.57){pageNo.textContent='01 / 03';hint.textContent='CUỘN TIẾP ĐỂ LẬT SANG TRANG HOA'}else if(p<.82){pageNo.textContent='02 / 03';hint.textContent='CUỘN TIẾP ĐỂ XEM LỜI CẢM ƠN'}else{pageNo.textContent='03 / 03';hint.textContent='LỜI CẢM ƠN'}}
function queue(){if(!raf)raf=requestAnimationFrame(render)}addEventListener('scroll',queue,{passive:true});addEventListener('resize',queue,{passive:true});addEventListener('pageshow',queue);document.getElementById('replay').addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'}));render();
})();
</script></body></html>
